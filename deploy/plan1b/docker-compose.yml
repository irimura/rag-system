# 案1b: Open WebUI 内蔵 RAG 最小構成(Node B)
# 構築手順: docs/deployment-guide.md
# 外部公開は nginx(80/443)のみ。他は 127.0.0.1 バインド
services:
  nginx:
    image: nginx:1.30.3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - open-webui
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OPENAI_API_BASE_URL=${VLLM_BASE_URL}
      - OPENAI_API_KEY=${VLLM_API_KEY}
      - ENABLE_OLLAMA_API=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - VECTOR_DB=chroma
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL}
      - ENABLE_RAG_HYBRID_SEARCH=${ENABLE_RAG_HYBRID_SEARCH}
      - RAG_RERANKING_MODEL=${RAG_RERANKING_MODEL}
      - RAG_TOP_K=${RAG_TOP_K}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-}
      - ENABLE_OAUTH_GROUP_MANAGEMENT=${ENABLE_OAUTH_GROUP_MANAGEMENT:-}
      - ENABLE_OAUTH_GROUP_CREATION=${ENABLE_OAUTH_GROUP_CREATION:-}
      - OAUTH_GROUP_CLAIM=${OAUTH_GROUP_CLAIM:-}
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    profiles: ["idp"]
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_HOSTNAME=http://keycloak:8080
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ../keycloak/realm-rag.json:/opt/keycloak/data/import/realm-rag.json:ro

volumes:
  open-webui-data:
