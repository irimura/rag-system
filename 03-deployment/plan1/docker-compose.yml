# 案1: シングルプロセス最小構成(Node B)
# 構築手順: 03-deployment/deployment-guide.md
services:
  chainlit-app:
    build: ./app
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./documents:/data/documents:ro
      - chroma-data:/data/chroma_db
      - hf-cache:/root/.cache/huggingface   # モデルキャッシュ(再ビルド時の再DL防止)
    restart: unless-stopped

  # 取り込みバッチ: docker compose --profile ingest run --rm ingest
  ingest:
    build: ./app
    profiles: ["ingest"]
    env_file: .env
    command: ["python", "ingest.py"]
    volumes:
      - ./documents:/data/documents:ro
      - chroma-data:/data/chroma_db
      - hf-cache:/root/.cache/huggingface

volumes:
  chroma-data:
  hf-cache:
